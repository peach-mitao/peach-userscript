name: 验证用户脚本
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      runtime: ${{ steps.plan.outputs.runtime }}
      base: ${{ steps.plan.outputs.base }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
      - id: plan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci_plan.ts --base "$BASE_SHA" --event "$EVENT_NAME"
  verify:
    needs: plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
      - name: 文档格式与比较基线
        if: needs.plan.outputs.runtime == 'false'
        env:
          BASE_SHA: ${{ needs.plan.outputs.base }}
          EVENT_NAME: ${{ github.event_name }}
        run: node scripts/ci_plan.ts --base "$BASE_SHA" --event "$EVENT_NAME" --verify-docs
      - run: npm ci --ignore-scripts
        if: needs.plan.outputs.runtime == 'true'
      - name: 使用 runner 已安装的 Chrome
        if: needs.plan.outputs.runtime == 'true'
        run: |
          peachChrome="$(command -v google-chrome)"
          "$peachChrome" --version
          printf 'PEACH_E2E_CHROME=%s\n' "$peachChrome" >> "$GITHUB_ENV"
      - run: npm run verify
        if: needs.plan.outputs.runtime == 'true'
      - uses: actions/upload-artifact@v7.0.2
        if: needs.plan.outputs.runtime == 'true'
        with:
          name: peach-userscript
          path: dist/
          if-no-files-found: error
